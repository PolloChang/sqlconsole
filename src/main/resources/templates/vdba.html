<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Virtual DBA Dashboard</title>
    <script src="/js/jquery-3.7.1.min.js"></script>
    <script type="module" src="/js/editor.bundle.js"></script>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .cm-editor { border: 1px solid #ccc; height: 300px; font-size: 14px; background-color: white;}
        .cm-scroller { overflow: auto; }
        pre { background: #f4f4f4; padding: 10px; overflow-x: auto; }
        .suggestion { border-left: 5px solid #007bff; padding-left: 10px; margin-bottom: 10px; background: #f9f9f9; padding: 10px; }
        .suggestion.INFO { border-color: #17a2b8; }
        .suggestion.TIP { border-color: #28a745; }
        .suggestion.WARN { border-color: #ffc107; }

        /* Tree Visualization */
        .plan-tree { list-style-type: none; padding-left: 20px; }
        .plan-node { margin: 5px 0; padding: 5px; border: 1px solid #ddd; border-radius: 4px; background: #fff; }
        .plan-node.high-cost { border-color: red; background-color: #ffe6e6; }
        .node-header { display: flex; justify-content: space-between; font-weight: bold; }
        .node-details { font-size: 0.9em; color: #555; margin-top: 3px; }
        .node-cost { color: #d9534f; }
    </style>
</head>
<body>
<div class="container">
    <h1>🦁 Virtual DBA Dashboard</h1>
    <div>
        Logged in as: <span th:text="${username}"></span>
        <a href="/console" style="float: right;">Back to Console</a>
    </div>
    <hr/>

    <div style="margin-bottom: 20px;">
        <label for="dbId">Select Database:</label>
        <select id="dbId">
            <option th:each="db : ${dbs}" th:value="${db.id}" th:text="${db.name}"></option>
        </select>
    </div>

    <div>
        <label>SQL Query:</label>
        <div id="editor"></div>
    </div>

    <button onclick="diagnose()" style="margin-top: 10px; padding: 10px 20px;">Diagnose SQL</button>

    <div id="loading" style="display: none; color: blue; margin-top: 20px;">Analyzing...</div>
    <div id="error" style="display: none; color: red; margin-top: 20px;"></div>

    <div id="report" style="display: none; margin-top: 20px;">
        <h2>Diagnostic Report</h2>

        <h3>Suggestions</h3>
        <div id="suggestions"></div>

        <h3>Execution Plan Visualization</h3>
        <div id="plan-viz"></div>

        <details>
            <summary>Raw Execution Plan (JSON)</summary>
            <pre id="plan"></pre>
        </details>
    </div>
</div>

<script>
    $(document).ready(function() {
        loadSchema();
        $("#dbId").change(function() {
            loadSchema();
        });
    });

    function loadSchema() {
        let dbId = $("#dbId").val();
        if (!dbId) return;

        $.get("/api/schema", { dbId: dbId }, function(schema) {
             if (window.updateEditorSchema) {
                 window.updateEditorSchema(schema);
             }
        });
    }

    function diagnose() {
        const dbId = $("#dbId").val();
        let sql = "";
        if (window.getSmartSql) {
            sql = window.getSmartSql();
        }

        if (!sql) {
            alert("Please enter SQL");
            return;
        }

        $("#loading").show();
        $("#report").hide();
        $("#error").hide();

        $.post("/api/vdba/diagnose", { dbId: dbId, sql: sql }, function(report) {
            $("#loading").hide();
            $("#report").show();

            // Render Suggestions
            const $suggestions = $("#suggestions").empty();
            if (report.suggestions && report.suggestions.length > 0) {
                report.suggestions.forEach(s => {
                    const $div = $("<div>").addClass("suggestion").addClass(s.type);
                    $div.append($("<strong>").text(s.type + ": "));
                    $div.append($("<span>").text(s.message));
                    $suggestions.append($div);
                });
            } else {
                $suggestions.append("<div>No specific suggestions.</div>");
            }

            // Render Visualization
            const $viz = $("#plan-viz").empty();
            if (report.normalizedPlan) {
                $viz.append(renderNode(report.normalizedPlan));
            } else {
                $viz.text("Visualization not available for this plan.");
            }

            // Render Raw Plan
            let planText = "";
            if (report.plan) {
                 if (report.plan.format === 'JSON') {
                     try {
                        const jsonObj = JSON.parse(report.plan.rawJson);
                        planText = JSON.stringify(jsonObj, null, 2);
                     } catch(e) {
                        planText = report.plan.rawJson;
                     }
                 } else {
                     planText = report.plan.rawJson;
                 }
            }
            $("#plan").text(planText);

        }).fail(function(xhr) {
             $("#loading").hide();
             $("#error").text("Error: " + xhr.responseText).show();
        });
    }

    function renderNode(node) {
        const $ul = $("<ul>").addClass("plan-tree");
        const $li = $("<li>");

        const isHighCost = (node.operation.includes("Seq Scan") || node.operation.includes("ALL"));
        const $div = $("<div>").addClass("plan-node").toggleClass("high-cost", isHighCost);

        const $header = $("<div>").addClass("node-header");
        $header.append($("<span>").text(node.operation));
        if (node.cost > 0) {
             $header.append($("<span>").addClass("node-cost").text("Cost: " + node.cost));
        }

        const $details = $("<div>").addClass("node-details");
        let detailsText = "";
        if (node.rows > 0) detailsText += "Rows: " + node.rows + " ";
        if (node.actualTime > 0) detailsText += "| Time: " + node.actualTime + "ms";
        $details.text(detailsText);

        $div.append($header).append($details);
        $li.append($div);

        if (node.children && node.children.length > 0) {
            node.children.forEach(child => {
                $li.append(renderNode(child));
            });
        }

        $ul.append($li);
        return $ul;
    }
</script>
</body>
</html>
